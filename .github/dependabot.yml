# Keep the supply chain current: GitHub Actions and Cargo dependencies.
#
# From templates/dependabot.yml in Project-Colony-Resources, plus the wgpu
# ignore below. Dependabot opening a PR is not the rule being followed: merging
# it is. See design/dependencies.md there: everything is on its latest release,
# always.
version: 2
updates:
  # A stale action is the same problem as a stale crate, with more privileges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Transitive crates too, so the lockfile stays current without a manual
    # `cargo update`.
    allow:
      - dependency-type: all
    ignore:
      # Xion only uses `wgpu` to ask whether a Vulkan adapter exists before
      # restricting iced to it (see `prefer_vulkan_when_available` in main.rs).
      # Its version must stay the one iced_wgpu declares, or Cargo builds a
      # second wgpu instead of reusing iced's. It follows iced, not wgpu's own
      # releases: iced_wgpu 0.14 pins wgpu 27, and a bump to 30 failed to build.
      # It moves when Xion moves to a new iced.
      - dependency-name: wgpu
    groups:
      # Minor and patch bumps arrive as one PR, so a routine week is one review
      # rather than fifteen. Majors stay separate: they deserve their own read.
      cargo-minor:
        update-types: ["minor", "patch"]
