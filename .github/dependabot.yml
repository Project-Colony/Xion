# Copy to .github/dependabot.yml.
# Rules: design/dependencies.md "Automatic merges". Add only
# repository-specific ignores, directories or a cargo-dev group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: Europe/Brussels
    # GitHub Actions supports default-days only.
    cooldown:
      default-days: 7
    # chore is a hidden changelog section, so action updates never release.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Dependabot names the shared workflows after their path, hence the wildcard.
      # The pin moves by hand (design/releases.md "The pin").
      - dependency-name: "Project-Colony/Project-Colony-Resources*"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: Europe/Brussels
    cooldown:
      default-days: 7
    # fix lands under Fixes and cuts a patch release.
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    ignore:
      # Xion only uses `wgpu` to ask whether a Vulkan adapter exists before
      # restricting iced to it (see `prefer_vulkan_when_available` in main.rs).
      # Its version must stay the one iced_wgpu declares, or Cargo builds a
      # second wgpu instead of reusing iced's. It follows iced, not wgpu's own
      # releases: iced_wgpu 0.14 pins wgpu 27, and a bump to 30 failed to build.
      # It moves when Xion moves to a new iced.
      - dependency-name: wgpu
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Repository-specific: crates listed only under [dev-dependencies].
      # weekly-merge.yml squashes this group as chore(deps), so it never
      # releases. List the same names in cargo-minor's exclude-patterns.
      # cargo-dev:
      #   patterns: ["criterion", "tempfile"]
      #   update-types: ["minor", "patch"]
      cargo-minor:
        update-types: ["minor", "patch"]
        # exclude-patterns: ["criterion", "tempfile"]
