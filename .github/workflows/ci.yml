name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory surfaces without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the version, components and targets; rustup
      # honours it from the checkout.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features

      # Same check as the release workflow's Windows leg: SignPath signs only
      # an .exe whose version resource names the project and carries its
      # version, and build.rs is what writes it. Checked here so a pull
      # request that breaks it fails now rather than at the next release.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'xion' | ForEach-Object version
          $info = (Get-Item target\debug\xion.exe).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Xion' -or $info.ProductVersion -cne $version) {
            "::error::xion.exe has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Xion' and '$version'"
            exit 1
          }

      - name: No UTF-8 BOM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=0
          while IFS= read -r file; do
            if [ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "UTF-8 BOM in $file"
              found=1
            fi
          done < <(find src tests -name '*.rs')
          exit $found

  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
