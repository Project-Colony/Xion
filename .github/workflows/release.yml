# Xion - release workflow
#
# Built from templates/sign-and-publish-caller.yml in Project-Colony-Resources;
# the contract it implements is design/releases.md there. Conventional commits
# go in, a release PR comes out, merging it creates the tag, and the tag is what
# builds, signs and publishes. Nothing is released by hand.
#
# Xion ships Linux and Windows only, the two targets rust-toolchain.toml
# declares. The template's macOS rows are deliberately absent: a program that
# ships no macOS asset is simply unavailable there, which is a choice, not a gap.
# Assets follow the Colony naming convention, so colony.json needs no
# releaseFiles:
#
#   xion-linux  xion-windows.exe
#
# The build legs only build, check and upload artifacts; they never see a key.
# Authenticode (SignPath, once approved), the ed25519 .sig/.meta/.meta.sig,
# verification and publishing all happen in
# .github/workflows/sign-and-publish.yml of Project-Colony-Resources, in this
# same run. See design/releases.md there, section "Shared signing workflow".
#
# Action refs are pinned to commit SHAs on purpose: the called workflow handles
# the organisation's release signing key, and whoever can move a floating tag
# can read that secret.

name: Release

on:
  push:
    branches: [main]
  # Recovery path: finish an existing DRAFT release whose run failed.
  # release-please emits `release_created` once per release, so "Re-run all
  # jobs" on the original run makes it report nothing to do and every job
  # below skip. Start the dispatch from the tag ("Use workflow from: v0.1.0",
  # or `gh workflow run release.yml --ref v0.1.0 -f tag=v0.1.0`): with SignPath
  # on, sign-and-publish refuses a run whose commit is not the tag's, since
  # SignPath records the run's commit as the source of what it signs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release to build, sign and publish (e.g. v0.1.0). Run from that same tag."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Assembles a release PR from the conventional commits since the last release.
  # Merging that PR is what creates the tag; everything below runs only then.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Labelling the release PR goes through the issues API.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input, on purpose: when it is set, the action
      # ignores both files below, and with them the changelog sections, the
      # bump policy and the version in the manifest. The release type lives in
      # release-please-config.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please PUBLISHES the release - and moves /releases/latest -
      # before a single binary exists. For the whole build window every Colony
      # in the field would show an update badge whose every click fails. Held
      # as a draft here; sign-and-publish refuses anything else and publishes
      # it last, once every file is signed and verified on the release.
      - name: Hold the release as a draft until it is complete
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        # `-R` is not optional: this job has no `actions/checkout`, so `gh` has
        # no git remote to infer the repository from and dies with "fatal: not
        # a git repository", which skips the build and publishes an empty tag.
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  build:
    name: build ${{ matrix.asset }}
    needs: release-please
    # Runs on a merge that created a release, or on a recovery dispatch (when
    # release-please is skipped). NOT `always()`: a FAILED release-please must
    # stop the run at an empty draft.
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any
    # job leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: "xion-linux"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: "xion-windows.exe"

    steps:
      # The tag, not the branch: a recovery dispatch must rebuild the tagged
      # commit, since the .meta sidecar binds these bytes to that version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          persist-credentials: false

      # rust-toolchain.toml pins the version and lists both targets, and
      # rustup honours it from the checkout. No `targets:` input: it would
      # install them for the action's own toolchain, not the pinned one.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      # Without this every panic! and #[track_caller] site embeds the runner's
      # home directory (.cargo/config.toml explains why it cannot live there).
      # A prefix that does not match is simply not rewritten.
      - name: Anonymise build paths
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            registry="${cargo_home}\\registry\\src\\"
          else
            registry="${cargo_home}/registry/src/"
          fi
          echo "CARGO_BUILD_RUSTFLAGS=--remap-path-prefix=${registry}=deps/ --remap-path-prefix=${GITHUB_WORKSPACE}=xion" >> "$GITHUB_ENV"

      # `--locked`: the binary users download is built from the committed
      # Cargo.lock, and a lockfile that no longer matches Cargo.toml fails here
      # instead of being quietly updated.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/xion ${{ matrix.asset }}

      - name: Name the artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\xion.exe ${{ matrix.asset }}

      # A manifest can PARSE perfectly and still leave the program listed in
      # Colony with no Download button, because none of its assets match a
      # convention. `colony validate-manifest` given the asset names catches
      # exactly that. Linux only: one check per release is enough. No key is
      # on this runner: signing happens in sign-and-publish.
      - name: Validate colony.json
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o colony-validator \
            https://github.com/Project-Colony/Colony/releases/latest/download/colony-linux
          chmod +x colony-validator
          ./colony-validator validate-manifest colony.json xion-linux xion-windows.exe
          rm -f colony-validator

      # The signature proves provenance and says nothing about whether the
      # binary RUNS. `--version` prints and exits before any window opens.
      - name: Smoke-test the artifact
        shell: bash
        run: |
          chmod +x "${{ matrix.asset }}" || true
          "./${{ matrix.asset }}" --version

      # SignPath signs only an .exe whose version resource names the project
      # and carries its version (build.rs writes it). A build that lost either
      # would be refused at signing time, hours later; this fails it here.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $info = (Get-Item $env:ASSET).VersionInfo
          $version = $env:TAG -replace '^v', ''
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Xion' -or $info.ProductVersion -cne $version) {
            "::error::$env:ASSET has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Xion' and '$version'"
            exit 1
          }

      # The file at the artifact root, under its release name. The name
      # prefix is what `artifact-pattern` below matches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # Authenticode (once SignPath is on), .sig/.meta/.meta.sig over the final
  # bytes, upload to the draft, download again, verify, publish. Chained as
  # `needs:` in this same run: SignPath accepts only an artifact uploaded by
  # the run that requests the signature.
  sign-and-publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # main
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      assets: "xion-linux xion-windows.exe"
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "xion"
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
