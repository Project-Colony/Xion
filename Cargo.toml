[package]
name = "xion"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Xion Contributors"]
description = "A modern, performant file explorer written in Rust"
repository = "https://github.com/Project-Colony/Xion"
license = "GPL-3.0-or-later"
keywords = ["file-explorer", "gui", "iced", "filesystem"]
categories = ["gui", "filesystem"]

[features]
# `XionApp::new_for_test` and the `*_for_test` accessors are compiled out of
# release builds: they only exist under `cfg(test)` or this feature. Integration
# tests live outside the crate, where `cfg(test)` does not apply, so the
# self dev-dependency below turns the feature on for them alone.
test-util = []

[dependencies]
# The shared Colony foundation: palettes, configuration paths, i18n and
# widgets. Taken from crates.io, as Colony itself does.
colony-ui = "0.1.6"
# The same shared buffer iced expects for its images: keeping a thumbnail's
# bytes in a `Bytes` avoids handing a copy to the handle.
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
# `image-without-codecs` rather than `image`: the latter turns on image's own
# default feature set, which re-enabled every codec the line below deliberately
# refuses (exr, avif, qoi...). They were compiled and linked regardless.
iced = { version = "0.14.0", features = ["image-without-codecs", "wgpu", "tokio"] }
# Only to ask wgpu whether it finds a Vulkan adapter, before restricting it to
# Vulkan: see `prefer_vulkan_when_available` in src/platform/gpu.rs. Same version
# and features as iced_wgpu declares, so the crate already compiled for iced is
# reused as is: no extra compilation.
wgpu = { version = "27.0.1", default-features = false, features = ["std"] }
# The integrated terminal: a real VT grid, not a line reader. Backed by
# alacritty_terminal, and above all built for iced 0.14, Xion's exact version.
# The model hand-written here could not position a cursor in two dimensions, so
# every full-screen program (claude, vim, htop, lazygit) stacked its redraws
# instead of overwriting them.
#
# Pinned on an upstream revision rather than 0.8.0, because of a flaw 0.8.0
# carries that made the terminal unusable here:
# https://github.com/Harzu/iced_term/issues/67
#
# `TerminalSize::default()` declares `layout_width: 80.0` and
# `layout_height: 50.0` (pixels) with 1x1 cells. As soon as the real font
# measure arrives before the panel size is known, the grid drops to
# `80/8 = 10` columns by `50/18 = 2` rows. On ten columns, a zsh prompt wraps on
# every keystroke and zle redraws endlessly: characters seemed to duplicate
# while the shell received exactly what was typed.
#
# The fix (PR #70) resets the widget state when the terminal id changes;
# without it, switching shell or tab created a terminal the widget never
# resized. The revision also brings #69 (deadlock on event sending) and #89
# (Ctrl+U sent "Q").
#
# Move back to a published version as soon as one ships.
iced_term = { git = "https://github.com/Harzu/iced_term", rev = "1df60bb08a6a0ffcf3dfc1a74ee568947fc48cb8", version = "0.8.0" }
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "process", "io-util"] }
# No "tiff": it was the only thing pulling tiff -> zune-jpeg 0.4, a SECOND
# complete JPEG decoder alongside the zune-jpeg 0.5 that image itself uses.
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
# The locale tables in src/i18n/. Already in the tree through colony-ui, which
# reads its own shared labels the same way.
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"
sha2 = "0.11.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
git2 = { version = "0.21.0", default-features = false }
walkdir = "2.5.0"
zip = "8.6.0"
pdf-extract = "0.12.1"
tar = "0.4.46"
flate2 = "1.1.10"
# The maintained fork of sevenz-rust, which is unmaintained (RUSTSEC-2026-0246).
# No "aes256": Xion opens archives without a password.
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["bzip2", "compress", "ppmd"] }
ignore = "0.4.33"
encoding_rs = "0.8.42"
mdns-sd = "0.21.5"

# Already compiled into the binary: iced pulls it in through mundy, which reads
# the desktop appearance settings. The single instance therefore costs no extra
# dependency, only the version Cargo already agrees on.
[target.'cfg(unix)'.dependencies]
zbus = "5.19.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Tests must never touch the user's real config directory or home; every test
# that needs a filesystem gets a tempdir that cleans itself up.
tempfile = "3.27.0"
# A package may dev-depend on itself: this is what turns `test-util` on for
# tests/ without ever enabling it for the shipped binary.
xion = { path = ".", features = ["test-util"] }

# Deliberately NOT under [target.'cfg(windows)'.build-dependencies]: build
# dependencies are resolved for the HOST, so gating them on Windows would make
# the crate unavailable exactly when cross-compiling Linux -> Windows. build.rs
# gates the call itself on CARGO_CFG_TARGET_OS instead.
[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
# The profile design/releases.md in Project-Colony-Resources recommends.
lto = "thin"
codegen-units = 1
# No `panic = "abort"`: pdf-extract, zip, sevenz-rust, image and syntect all
# parse attacker-supplied files inside `spawn_blocking`, and none of them
# promises to be panic-free. Aborting turned a malformed thumbnail into the loss
# of every tab, the terminal session and any running copy; unwinding lets tokio
# surface the panic as a JoinError and the preview simply fails.
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
