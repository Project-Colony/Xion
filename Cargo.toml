[package]
name = "xion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Xion Contributors"]
description = "A modern, performant file explorer written in Rust"
repository = "https://github.com/MotherSphere/Xion-Private"
license = "MIT"
keywords = ["file-explorer", "gui", "iced", "filesystem"]
categories = ["gui", "filesystem"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5.0"
iced = { version = "0.14", features = ["image", "wgpu", "tokio"] }
tokio = { version = "1", features = ["rt", "time", "sync", "process", "io-util"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
git2 = { version = "0.19", default-features = false }
walkdir = "2"
zip = "2"
pdf-extract = "0.7"
tar = "0.4"
flate2 = "1"
sevenz-rust = "0.6"
ignore = "0.4"
encoding_rs = "0.8"
suppaftp = { version = "6", features = ["native-tls"] }
mdns-sd = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_NetworkManagement_WNet", "Win32_Foundation"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
