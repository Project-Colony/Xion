[package]
name = "xion"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["Xion Contributors"]
description = "A modern, performant file explorer written in Rust"
repository = "https://github.com/Project-Colony/Xion"
license = "GPL-3.0-or-later"
keywords = ["file-explorer", "gui", "iced", "filesystem"]
categories = ["gui", "filesystem"]

[features]
# `XionApp::new_for_test` and the `*_for_test` accessors are compiled out of
# release builds: they only exist under `cfg(test)` or this feature. Integration
# tests live outside the crate, where `cfg(test)` does not apply, so the
# self dev-dependency below turns the feature on for them alone.
test-util = []

# Remote FTP browsing. Unreachable from the UI today; see the note on suppaftp.
ftp = ["dep:suppaftp"]

[dependencies]
# The shared Colony foundation: palettes, configuration paths, i18n and
# widgets. Taken from crates.io, as Colony itself does.
colony-ui = "0.1.5"
# Le même tampon partagé que celui qu'iced attend pour ses images : garder les
# octets d'une vignette dans un `Bytes` évite d'en donner une copie au handle.
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
# `image-without-codecs` rather than `image`: the latter turns on image's own
# default feature set, which re-enabled every codec the line below deliberately
# refuses (exr, avif, qoi...). They were compiled and linked regardless.
iced = { version = "0.14.0", features = ["image-without-codecs", "wgpu", "tokio"] }
# Uniquement pour demander à wgpu s'il trouve un adaptateur Vulkan, avant de le
# restreindre à Vulkan — voir `prefer_vulkan_when_available` dans main.rs. Mêmes
# version et mêmes features que ce qu'iced_wgpu déclare, donc la caisse déjà
# compilée pour iced est réutilisée telle quelle : aucune compilation ajoutée.
wgpu = { version = "27.0.1", default-features = false, features = ["std"] }
# Le terminal intégré : une vraie grille VT, pas un lecteur de lignes.
# Adossé à alacritty_terminal, et surtout construit pour iced 0.14 — la version
# exacte de Xion. Le modèle écrit à la main ici ne savait pas positionner un
# curseur en deux dimensions, donc tout programme plein écran — claude, vim,
# htop, lazygit — empilait ses redessins au lieu de les recouvrir.
#
# Épinglé sur une révision amont plutôt que sur 0.8.0, à cause d'un défaut que
# 0.8.0 porte et qui rendait le terminal inutilisable ici :
# https://github.com/Harzu/iced_term/issues/67
#
# `TerminalSize::default()` déclare `layout_width: 80.0` et `layout_height: 50.0`
# — des pixels — avec des cellules de 1×1. Dès que la mesure de police réelle
# arrive sans que la taille du panneau ne soit encore connue, la grille tombe à
# `80/8 = 10` colonnes sur `50/18 = 2` lignes. Sur dix colonnes, une invite zsh
# enroule à chaque frappe et zle redessine sans fin : les caractères semblaient
# se dupliquer alors que le shell recevait exactement ce qu'on tapait.
#
# Le correctif (PR #70) réinitialise l'état du widget quand l'identifiant du
# terminal change ; sans lui, changer d'interpréteur ou d'onglet créait un
# terminal que le widget ne redimensionnait jamais. La révision apporte aussi
# #69 (interblocage sur l'envoi d'événements) et #89 (Ctrl+U envoyait « Q »).
#
# À repasser sur une version publiée dès qu'elle sort.
iced_term = { git = "https://github.com/Harzu/iced_term", rev = "1df60bb08a6a0ffcf3dfc1a74ee568947fc48cb8", version = "0.8.0" }
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "process", "io-util"] }
# No "tiff": it was the only thing pulling tiff -> zune-jpeg 0.4, a SECOND
# complete JPEG decoder alongside the zune-jpeg 0.5 that image itself uses.
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"
sha2 = "0.11.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
git2 = { version = "0.21.0", default-features = false }
walkdir = "2.5.0"
zip = "8.6.0"
pdf-extract = "0.12.1"
tar = "0.4.46"
flate2 = "1.1.10"
# The maintained fork of sevenz-rust, which is unmaintained (RUSTSEC-2026-0246).
# No "aes256": Xion opens archives without a password.
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["bzip2", "compress", "ppmd"] }
ignore = "0.4.33"
encoding_rs = "0.8.42"
# Optional, and off by default. `list_ftp_directory` has no caller anywhere in
# src/ui/: nothing in the interface can reach it. Enabling it by default cost
# twelve crates including the whole openssl chain — and a build dependency on
# the system OpenSSL — for code that never runs. Turn it back on with
# `--features ftp` once there is a command that calls it.
suppaftp = { version = "12.1.1", features = ["native-tls"], optional = true }
mdns-sd = "0.21.5"

# Déjà compilé dans le binaire — iced le tire via mundy, qui lit les réglages
# d'apparence du bureau. L'instance unique ne coûte donc aucune dépendance
# supplémentaire, seulement la version sur laquelle Cargo s'accorde déjà.
[target.'cfg(unix)'.dependencies]
zbus = "5.19.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Tests must never touch the user's real config directory or home; every test
# that needs a filesystem gets a tempdir that cleans itself up.
tempfile = "3.27.0"
# A package may dev-depend on itself: this is what turns `test-util` on for
# tests/ without ever enabling it for the shipped binary.
xion = { path = ".", features = ["test-util"] }

# Deliberately NOT under [target.'cfg(windows)'.build-dependencies]: build
# dependencies are resolved for the HOST, so gating them on Windows would make
# the crate unavailable exactly when cross-compiling Linux -> Windows. build.rs
# gates the call itself on CARGO_CFG_TARGET_OS instead.
[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
# The profile design/releases.md in Project-Colony-Resources recommends.
lto = "thin"
codegen-units = 1
# No `panic = "abort"`: pdf-extract, zip, sevenz-rust, image and syntect all
# parse attacker-supplied files inside `spawn_blocking`, and none of them
# promises to be panic-free. Aborting turned a malformed thumbnail into the loss
# of every tab, the terminal session and any running copy; unwinding lets tokio
# surface the panic as a JoinError and the preview simply fails.
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
