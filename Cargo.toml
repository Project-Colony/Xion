[package]
name = "xion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Xion Contributors"]
description = "A modern, performant file explorer written in Rust"
repository = "https://github.com/MotherSphere/Xion-Private"
license = "MIT"
keywords = ["file-explorer", "gui", "iced", "filesystem"]
categories = ["gui", "filesystem"]

[features]
# `XionApp::new_for_test` and the `*_for_test` accessors are compiled out of
# release builds: they only exist under `cfg(test)` or this feature. Integration
# tests live outside the crate, where `cfg(test)` does not apply, so the
# self dev-dependency below turns the feature on for them alone.
test-util = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"
iced = { version = "0.14", features = ["image", "wgpu", "tokio"] }
tokio = { version = "1", features = ["rt", "time", "sync", "process", "io-util"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
notify = "8"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.39"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
git2 = { version = "0.19", default-features = false }
walkdir = "2"
zip = "2"
pdf-extract = "0.7"
tar = "0.4"
flate2 = "1"
sevenz-rust = "0.6"
ignore = "0.4"
encoding_rs = "0.8"
suppaftp = { version = "6", features = ["native-tls"] }
mdns-sd = "0.11"
portable-pty = "0.9.0"
vte = "0.15.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Tests must never touch the user's real config directory or home; every test
# that needs a filesystem gets a tempdir that cleans itself up.
tempfile = "3"
# A package may dev-depend on itself: this is what turns `test-util` on for
# tests/ without ever enabling it for the shipped binary.
xion = { path = ".", features = ["test-util"] }

# Deliberately NOT under [target.'cfg(windows)'.build-dependencies]: build
# dependencies are resolved for the HOST, so gating them on Windows would make
# the crate unavailable exactly when cross-compiling Linux -> Windows. build.rs
# gates the call itself on CARGO_CFG_TARGET_OS instead.
[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
# No `panic = "abort"`: pdf-extract, zip, sevenz-rust, image and syntect all
# parse attacker-supplied files inside `spawn_blocking`, and none of them
# promises to be panic-free. Aborting turned a malformed thumbnail into the loss
# of every tab, the terminal session and any running copy; unwinding lets tokio
# surface the panic as a JoinError and the preview simply fails.
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
