[package]
name = "xion"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "5.0"
iced = { version = "0.13", features = ["image", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
wgpu = "0.20"
winit = "0.29"
