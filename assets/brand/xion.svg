<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Xion: a folder, and the ion that orbits it.

    Two constraints shaped the drawing:

    - The folder is a solid fill, and its three bars are holes. A version
      with an ink folder over amber bars vanished in a dark dock: only the
      bars were left, floating in the void. A solid fill reads on any
      background.
    - The orbit passes behind the folder, with a gap of one and a half pixels
      all around (the "gap" mask). Without that gap the amber of the orbit and
      the amber of the folder merged into a single blot.

    The three bars are also the letter Xi, which starts the name.
  -->
  <defs>
    <mask id="gap">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M20 54a8 8 0 0 1 8-8h18a6 6 0 0 1 5 2.7L54 54h34a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8Z"
            fill="#000" stroke="#000" stroke-width="11"/>
    </mask>
    <mask id="bars">
      <rect width="128" height="128" fill="#fff"/>
      <g fill="#000">
        <rect x="31" y="66" width="54" height="8" rx="4"/>
        <rect x="31" y="79" width="35" height="8" rx="4"/>
        <rect x="31" y="92" width="45" height="8" rx="4"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <ellipse cx="60" cy="72" rx="60" ry="27" fill="none" stroke="#E8A33D" stroke-width="8"
             transform="rotate(-30 60 72)"/>
  </g>
  <path d="M20 54a8 8 0 0 1 8-8h18a6 6 0 0 1 5 2.7L54 54h34a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8Z"
        fill="#E8A33D" mask="url(#bars)"/>
  <circle cx="108" cy="30" r="10" fill="#E8A33D"/>
</svg>
