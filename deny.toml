# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# Optional features too (today only `ftp`), so the crates they pull in are
# checked even though the shipped binary leaves them out.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only "unmaintained" notices with no maintained release to move to and no
# path from untrusted input. Every vulnerability is fixed by upgrading instead.
ignore = [
    # bincode 1, through syntect 5.3 (its latest release). syntect only uses it
    # to load the syntax and theme dumps compiled into the binary
    # (`load_defaults_newlines`, `load_defaults`); no file a user opens is ever
    # deserialised with it.
    { id = "RUSTSEC-2025-0141", reason = "syntect's embedded dumps only; syntect has no release without bincode" },
    # ttf-parser, through iced 0.14 (cosmic-text, fontdb). It parses the fonts
    # bundled in the binary and the system's installed fonts, which Xion does
    # not choose; it cannot be removed without leaving iced.
    { id = "RUSTSEC-2026-0192", reason = "iced's font stack; no replacement release" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    # Celle de Xion et celle de `colony-ui`, dont Xion la tient : lier une
    # caisse GPL-3.0-or-later oblige le programme qui la lie à l'être aussi.
    # Sans cette entrée, `cargo deny check licenses` refuse la caisse elle-même,
    # qui figure dans son propre graphe de dépendances.
    "GPL-3.0-or-later",
    # Les suivantes décrivent les licences acceptables chez les dépendances
    # tierces, pas celle de Xion. La majorité de l'écosystème Rust est en
    # MIT/Apache double licence.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # libbz2-rs-sys, the pure-Rust bzip2 that zip and sevenz-rust2 use. A
    # permissive BSD-style licence, the one the C libbzip2 has always carried.
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# iced_term is pinned on an upstream revision until a release carries the fixes
# Xion needs; see the note on it in Cargo.toml.
allow-git = ["https://github.com/Harzu/iced_term"]
